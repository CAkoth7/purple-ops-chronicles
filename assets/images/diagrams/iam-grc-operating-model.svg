```xml
<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-family: Georgia, serif;
      fill: #1f2933;
      font-size: 14px;
    }
    .box {
      fill: #ffffff;
      stroke: #5b2d8b;
      stroke-width: 2;
      rx: 10;
    }
    .arrow {
      stroke: #5b2d8b;
      stroke-width: 2;
      marker-end: url(#arrowhead);
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5b2d8b"/>
    </marker>
  </defs>

  <!-- Boxes -->
  <rect class="box" x="220" y="20" width="280" height="50"/>
  <text x="360" y="50" text-anchor="middle">Executive Leadership</text>

  <rect class="box" x="220" y="90" width="280" height="50"/>
  <text x="360" y="120" text-anchor="middle">Risk Appetite &amp; Policy</text>

  <rect class="box" x="220" y="160" width="280" height="50"/>
  <text x="360" y="190" text-anchor="middle">GRC Oversight &amp; Assurance</text>

  <rect class="box" x="220" y="230" width="280" height="50"/>
  <text x="360" y="260" text-anchor="middle">IAM Governance Function</text>

  <rect class="box" x="220" y="300" width="280" height="50"/>
  <text x="360" y="330" text-anchor="middle">Technical IAM Controls</text>

  <!-- Arrows -->
  <line class="arrow" x1="360" y1="70" x2="360" y2="90"/>
  <line class="arrow" x1="360" y1="140" x2="360" y2="160"/>
  <line class="arrow" x1="360" y1="210" x2="360" y2="230"/>
  <line class="arrow" x1="360" y1="280" x2="360" y2="300"/>
</svg>
