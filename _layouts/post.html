<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} · PurpleOps Chronicles</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header>
  <h1>{{ page.title }}</h1>

  <div class="post-meta">
    {{ page.date | date: "%B %d, %Y" }}
    {% if page.topic %} · {{ page.topic }}{% endif %}
    {% if page.reading_time %} · {{ page.reading_time }}{% endif %}
  </div>

  <hr>
</header>

<main>
  <article class="content">
    {{ content }}
  </article>
</main>

<footer>
  <hr>
  <p><a href="{{ '/blog/' | relative_url }}">Back to Blog</a></p>
</footer>

</body>
</html>
