<article class="content">

  <header>
    <h1>{{ page.title }}</h1>

    <div class="post-meta">
      {{ page.date | date: "%B %d, %Y" }}
      {% if page.topic %} · {{ page.topic }}{% endif %}
      {% if page.reading_time %} · {{ page.reading_time }}{% endif %}
    </div>

    <hr>
  </header>

  {{ content }}

  <footer>
    <hr>
    <p><a href="{{ '/blog/' | relative_url }}">Back to Blog</a></p>
  </footer>

</article>
